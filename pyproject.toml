[project]
name = "manufacturing-erp-implementation-delivery-lab"
version = "2.2.0"
description = "面向国内面试的制造业 ERP 实施交付实验室，覆盖 FastAPI、SQL、数据迁移、Docker 和故障排查。"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "yangzhenheng" }]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "SQLAlchemy>=2.0",
  "pymysql>=1.1",
  "redis>=5.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error::DeprecationWarning:app.*",
]
