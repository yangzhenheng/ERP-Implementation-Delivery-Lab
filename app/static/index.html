<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>制造业 ERP 实施交付实验室</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--text:#172033;--muted:#657083;--line:#dfe4ea;--primary:#155e75;--ok:#087f5b;--warn:#b7791f;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Microsoft YaHei",Inter,Segoe UI,Arial,sans-serif;color:var(--text)}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#132238;color:#fff;padding:22px 16px}.brand{font-size:20px;font-weight:700;margin-bottom:24px;line-height:1.35}.nav{display:grid;gap:4px}.nav span{padding:10px 12px;border-radius:6px;color:#d6deea}.nav span:first-child{background:#203653;color:#fff}
.main{padding:24px 28px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}.top h1{font-size:24px;margin:0}.top p{margin:5px 0 0;color:var(--muted)}
.status{font-size:13px;border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:6px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:15px}.metric-label{color:var(--muted);font-size:12px}.metric-value{font-size:26px;font-weight:700;margin-top:7px}
.cols{display:grid;grid-template-columns:1.35fr .85fr;gap:14px;margin-top:14px}h2{font-size:16px;margin:0 0 12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:600}.tag{display:inline-block;border-radius:12px;padding:2px 8px;font-size:12px;background:#e7f5f8;color:var(--primary)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.muted{color:var(--muted)}.task{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
@media(max-width:980px){.layout{grid-template-columns:1fr}.side{position:static}.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.nav{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">制造业 ERP<br>实施交付实验室</div>
    <div class="nav">
      <span>驾驶舱</span><span>客户</span><span>产品</span><span>订单</span><span>库存</span><span>问题</span><span>实施任务</span><span>系统状态</span>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <div><h1>ERP 实施交付驾驶舱</h1><p>覆盖部署、MySQL、Linux、数据迁移、接口联调、日志排查、培训与上线验收。</p></div>
      <div class="status" id="status">系统状态检查中...</div>
    </div>
    <section class="grid" id="metrics"></section>
    <section class="cols">
      <div class="panel"><h2>销售订单</h2><table><thead><tr><th>订单号</th><th>客户</th><th>日期</th><th>金额</th><th>状态</th></tr></thead><tbody id="orders"></tbody></table></div>
      <div class="panel"><h2>实施任务</h2><div id="tasks"></div></div>
    </section>
    <section class="cols">
      <div class="panel"><h2>库存校验</h2><table><thead><tr><th>产品</th><th>仓库</th><th>数量</th><th>安全库存</th><th>状态</th></tr></thead><tbody id="inventory"></tbody></table></div>
      <div class="panel"><h2>未关闭问题</h2><table><thead><tr><th>问题</th><th>模块</th><th>级别</th></tr></thead><tbody id="issues"></tbody></table></div>
    </section>
  </main>
</div>
<script>
async function api(url){const r=await fetch(url);const b=await r.json();if(b.code!==0)throw new Error(b.message);return b.data}
const statusText={completed:'已完成',confirmed:'已确认',normal:'正常',closed:'已关闭',ok:'正常',open:'未关闭',low_stock:'库存不足',inventory_failed:'库存校验失败',in_progress:'进行中',not_started:'未开始',degraded_without_redis:'Redis降级运行',unavailable_degraded:'不可用已降级'};
const taskText={requirements:'需求调研',installation:'安装部署',configuration:'系统配置',data_migration:'数据迁移',testing:'联调测试',training:'用户培训',go_live:'上线切换',acceptance:'验收交付'};
function label(v){return statusText[v]||taskText[v]||v}
function statusClass(v){return v==='completed'||v==='normal'||v==='closed'||v==='ok'||v==='confirmed'?'ok':(v==='open'||v==='low_stock'||v==='inventory_failed'?'bad':'warn')}
(async()=>{
 const d=await api('/api/dashboard');
 const cards=[['订单总数',d.order_count],['今日订单',d.today_orders],['销售金额','¥'+Number(d.order_amount).toLocaleString()],['库存不足',d.low_stock_products],['未关闭问题',d.open_issues],['实施进度',d.implementation_progress+'%']];
 document.querySelector('#metrics').innerHTML=cards.map(x=>`<div class="panel"><div class="metric-label">${x[0]}</div><div class="metric-value">${x[1]}</div></div>`).join('');
 document.querySelector('#status').innerHTML=`系统：<span class="${statusClass(d.system_status)}">${label(d.system_status)}</span>`;
 const orders=await api('/api/orders');document.querySelector('#orders').innerHTML=orders.slice(0,6).map(o=>`<tr><td>${o.order_no}</td><td>${o.customer_name}</td><td>${o.order_date}</td><td>¥${Number(o.total_amount).toLocaleString()}</td><td><span class="${statusClass(o.status)}">${label(o.status)}</span></td></tr>`).join('');
 const tasks=await api('/api/implementation/tasks');document.querySelector('#tasks').innerHTML=tasks.map(t=>`<div class="task"><div><b>${label(t.task_type)}</b><div class="muted">${t.owner} · ${t.priority}</div></div><span class="${statusClass(t.status)}">${label(t.status)}</span></div>`).join('');
 const inv=await api('/api/inventory');document.querySelector('#inventory').innerHTML=inv.map(i=>`<tr><td>${i.product_code}<br><span class="muted">${i.product_name}</span></td><td>${i.warehouse_code}</td><td>${i.quantity}</td><td>${i.safety_stock}</td><td><span class="${statusClass(i.stock_status)}">${label(i.stock_status)}</span></td></tr>`).join('');
 const issues=await api('/api/issues');document.querySelector('#issues').innerHTML=issues.filter(i=>i.status!=='closed').slice(0,5).map(i=>`<tr><td>${i.title}</td><td>${i.module}</td><td><span class="tag">${i.severity}</span></td></tr>`).join('');
})().catch(e=>{document.querySelector('#status').textContent=e.message});
</script>
</body>
</html>
