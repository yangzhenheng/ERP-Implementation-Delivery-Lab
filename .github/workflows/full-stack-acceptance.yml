name: Full Stack Acceptance

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall app scripts tests
      - name: Run pytest
        run: pytest -q
      - name: Check Compose syntax
        run: docker compose config --quiet

  e2e-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright pytest-playwright
          python -m playwright install --with-deps chromium
      - name: Run SQLite browser E2E
        env:
          RUN_E2E: "1"
        run: |
          mkdir -p artifacts/e2e
          pytest tests/e2e | tee artifacts/e2e/pytest.txt
          grep -Eq "4 passed" artifacts/e2e/pytest.txt
          ! grep -Eq "skipped" artifacts/e2e/pytest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-sqlite-screenshots
          path: artifacts/e2e
          if-no-files-found: warn

  erp-full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: demo
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: erp_demo
      DB_USER: erp_user
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RUN_E2E: "1"
      E2E_BASE_URL: http://localhost
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright pytest-playwright
          python -m playwright install --with-deps chromium
      - name: Generate CI env file
        run: |
          DB_PASSWORD="$(python - <<'PY'
          import secrets, string
          chars = string.ascii_letters + string.digits
          print('Ci1!' + ''.join(secrets.choice(chars) for _ in range(24)))
          PY
          )"
          MYSQL_ROOT_PASSWORD="$(python - <<'PY'
          import secrets, string
          chars = string.ascii_letters + string.digits
          print('Ci1!' + ''.join(secrets.choice(chars) for _ in range(24)))
          PY
          )"
          echo "::add-mask::${DB_PASSWORD}"
          echo "::add-mask::${MYSQL_ROOT_PASSWORD}"
          {
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}"
          } >> "$GITHUB_ENV"
          cat > .env <<EOF
          APP_ENV=demo
          DB_HOST=mysql
          DB_PORT=3306
          DB_NAME=erp_demo
          DB_USER=erp_user
          DB_PASSWORD=${DB_PASSWORD}
          MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
          REDIS_HOST=redis
          REDIS_PORT=6379
          EOF
      - name: Run V3.1 full stack acceptance
        run: python scripts/run_v31_acceptance.py --ci --skip-sqlserver --keep-services
      - name: Collect Docker logs
        if: always()
        run: |
          mkdir -p artifacts/v31/logs
          docker compose ps > artifacts/v31/docker_ps_final.txt || true
          docker compose logs --no-color --tail=300 mysql > artifacts/v31/logs/mysql.log || true
          docker compose logs --no-color --tail=300 redis > artifacts/v31/logs/redis.log || true
          docker compose logs --no-color --tail=300 app > artifacts/v31/logs/app.log || true
          docker compose logs --no-color --tail=300 nginx > artifacts/v31/logs/nginx.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-full-stack-artifacts
          path: |
            artifacts/v31
            artifacts/e2e
          if-no-files-found: warn
      - name: Stop stack
        if: always()
        run: docker compose down || true

  sqlserver-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate SQL Server password
        run: |
          SQLSERVER_SA_PASSWORD="$(python - <<'PY'
          import secrets, string
          chars = string.ascii_letters + string.digits
          print('Ci1!' + ''.join(secrets.choice(chars) for _ in range(24)))
          PY
          )"
          echo "::add-mask::${SQLSERVER_SA_PASSWORD}"
          echo "SQLSERVER_SA_PASSWORD=${SQLSERVER_SA_PASSWORD}" >> "$GITHUB_ENV"
      - name: Run real SQL Server acceptance lab
        run: python scripts/sqlserver_lab.py --output-dir artifacts/v31
      - name: Collect SQL Server diagnostics
        if: always()
        run: |
          mkdir -p artifacts/v31/logs
          docker compose -f docker-compose.database-lab.yml ps -a > artifacts/v31/sqlserver_ps.txt || true
          docker compose -f docker-compose.database-lab.yml logs --no-color --tail=300 sqlserver > artifacts/v31/logs/sqlserver.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlserver-lab-artifacts
          path: artifacts/v31
          if-no-files-found: warn
      - name: Stop SQL Server lab
        if: always()
        run: docker compose -f docker-compose.database-lab.yml stop sqlserver || true
